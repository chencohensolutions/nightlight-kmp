name: Android APK

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test shared logic and build APK
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug --stacktrace

      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk nightlight-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nightlight-debug-apk
          path: nightlight-debug.apk

      - name: Publish to "latest-debug" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-debug
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" nightlight-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Night Light (debug build)" \
            --notes "Debug-signed APK built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Install on your phone and allow installs from this source."
